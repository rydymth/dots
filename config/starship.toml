"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500        # keeps the prompt snappy if git is slow

format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$dotnet\
$nodejs\
$cmd_duration\
$status\
$line_break\
$character"""

palette = "apple"

[palettes.apple]
blue    = "#81a2be"
cyan    = "#8abeb7"
purple  = "#b294bb"
green   = "#b5bd68"
yellow  = "#f0c674"
red     = "#cc6666"
orange  = "#de935f"
muted   = "#707880"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " ro"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 28

[git_commit]
only_detached = false           # always show the short hash
commit_hash_length = 7
style = "muted"
tag_disabled = false
tag_symbol = " tag "
format = "[$hash$tag]($style) "

[git_state]
style = "bold orange"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "=${count}"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "[?${count}](cyan)"
stashed    = "[\\$${count}](muted)"
modified   = "!${count}"
staged     = "[+${count}](green)"
renamed    = "»${count}"
deleted    = "[✘${count}](red)"

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[dotnet]
symbol = ".NET "
style = "orange"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "node "
style = "green"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[$duration]($style) "

[status]
disabled = false
style = "bold red"
format = "[$status]($style) "

[character]
success_symbol        = "[❯](bold green)"
error_symbol          = "[❯](bold red)"
vimcmd_symbol         = "[❮](bold cyan)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol  = "[❮](bold yellow)"
