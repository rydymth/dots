# Modular tmux config. Edit the small files in conf.d/ (loaded in numeric order):
#   00-options    shell, terminal, mouse, numbering
#   10-keys       prefix, splits, windows, panes, sessions
#   20-popup      floating terminal, session picker, config editor
#   30-navigator  seamless Ctrl-h/j/k/l between tmux and neovim
#   90-theme      colors (Apple Classic Pastel Dark)
# Reload with prefix + r. Edit with prefix + E.
source-file -q ~/.config/tmux/conf.d/*.conf
