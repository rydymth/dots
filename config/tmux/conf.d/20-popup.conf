# ── floating terminal: Alt-t (or prefix + t) toggles it ──
# One persistent session called "scratch" lives behind the popup.
# Press the key again from inside it to hide it; your shell keeps running.
# "TMUX=" lets tmux start inside the popup without the nesting warning.
bind -n M-t if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -E -w 80% -h 80% -b rounded -T ' scratch ' -d '#{pane_current_path}' 'TMUX= tmux new-session -A -s scratch \; set-option status off'
}
bind t if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -E -w 80% -h 80% -b rounded -T ' scratch ' -d '#{pane_current_path}' 'TMUX= tmux new-session -A -s scratch \; set-option status off'
}

# ── fuzzy session switcher: Alt-f (or prefix + f) ──────
# "##S" is a literal #S (a single # would be expanded by tmux first)
bind -n M-f display-popup -E -w 50% -h 40% -b rounded -T ' sessions ' "tmux list-sessions -F '##S' | grep -vx scratch | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"
bind f display-popup -E -w 50% -h 40% -b rounded -T ' sessions ' "tmux list-sessions -F '##S' | grep -vx scratch | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"

# ── edit this config in a popup: prefix + E ────────────
bind E display-popup -E -w 90% -h 90% -b rounded -T ' tmux config ' "nvim ~/.config/tmux"
