# ── prefix: Ctrl-a ─────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── panes: split ───────────────────────────────────────
# prefix + v  side by side   |  prefix + s  stacked   (same idea as nvim sv / sh)
# Alt-v / Alt-s do the same with no prefix. prefix + | and - also work.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── panes: move / resize / zoom / close ────────────────
# moving between panes is Ctrl-h/j/k/l (30-navigator.conf); prefix h/j/k/l also works
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-z resize-pane -Z            # zoom / unzoom the current pane
bind x kill-pane                      # asks for confirmation

# ── windows ────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── sessions ───────────────────────────────────────────
# detach: prefix + d  or  Alt-d      reattach from the shell: tn <name> / ta <name>
bind -n M-d detach-client
bind S choose-tree -Zs                                   # tree of sessions and windows
bind N command-prompt -p "new session name:" "new-session -d -s '%%' ; switch-client -t '%%'"
bind R command-prompt -I "#S" -p "rename session:" "rename-session '%%'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# ── copy mode (vi keys) ────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── reload ─────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
