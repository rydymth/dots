# apple-classic-dark (dark). Generated by tools/build.py: edit tools/palettes.py instead.

# ── status bar ─────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#222121,fg=#c5c8c6"
set -g status-left-length 40
set -g status-right-length 80

# session name turns orange while the prefix key is active
set -g status-left "#[bg=#{?client_prefix,#de935f,#81a2be},fg=#222121,bold] #S #[default] "
set -g window-status-separator ""
set -g window-status-format "#[fg=#707880] #I #W "
set -g window-status-current-format "#[bg=#373b41,fg=#8abeb7,bold] #I #W#{?window_zoomed_flag, Z,} #[default]"
set -g window-status-activity-style "fg=#f0c674"
set -g window-status-bell-style "fg=#cc6666"

# right side: prefix hint, git branch of the active pane, clock
set -g status-right "#[fg=#de935f]#{?client_prefix,PREFIX ,}#[fg=#b294bb]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=#707880]%H:%M "

# ── panes, messages, popups ────────────────────────────
set -g pane-border-style "fg=#424040"
set -g pane-active-border-style "fg=#81a2be"
set -g message-style "bg=#373b41,fg=#f0c674"
set -g message-command-style "bg=#373b41,fg=#8abeb7"
set -g mode-style "bg=#373b41,fg=#f0c674"
set -g popup-style "bg=#222121,fg=#c5c8c6"
set -g popup-border-style "fg=#81a2be"
set -g popup-border-lines rounded
set -g display-panes-active-colour "#81a2be"
set -g display-panes-colour "#707880"
set -g clock-mode-colour "#8abeb7"
