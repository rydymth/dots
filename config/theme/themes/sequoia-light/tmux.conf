# sequoia-light (light). Generated by tools/build.py: edit tools/palettes.py instead.

# ── status bar ─────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#F5F5F7,fg=#1D1D1F"
set -g status-left-length 40
set -g status-right-length 80

# session name turns orange while the prefix key is active
set -g status-left "#[bg=#{?client_prefix,#AE3A00,#0A5CC8},fg=#FFFFFF,bold] #S #[default] "
set -g window-status-separator ""
set -g window-status-format "#[fg=#636366] #I #W "
set -g window-status-current-format "#[bg=#E5E5EA,fg=#00677C,bold] #I #W#{?window_zoomed_flag, Z,} #[default]"
set -g window-status-activity-style "fg=#7F5300"
set -g window-status-bell-style "fg=#C9091C"

# right side: prefix hint, git branch of the active pane, clock
set -g status-right "#[fg=#AE3A00]#{?client_prefix,PREFIX ,}#[fg=#7E2DAA]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=#636366]%H:%M "

# ── panes, messages, popups ────────────────────────────
set -g pane-border-style "fg=#A1A1A6"
set -g pane-active-border-style "fg=#0A5CC8"
set -g message-style "bg=#E5E5EA,fg=#7F5300"
set -g message-command-style "bg=#E5E5EA,fg=#00677C"
set -g mode-style "bg=#B3D7FF,fg=#1D1D1F"
set -g popup-style "bg=#F5F5F7,fg=#1D1D1F"
set -g popup-border-style "fg=#0A5CC8"
set -g popup-border-lines rounded
set -g display-panes-active-colour "#0A5CC8"
set -g display-panes-colour "#636366"
set -g clock-mode-colour "#00677C"
