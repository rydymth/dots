# powershell-light (light). Generated by tools/build.py: edit tools/palettes.py instead.

# ── status bar ─────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#E5EDF8,fg=#0B1B33"
set -g status-left-length 40
set -g status-right-length 80

# session name turns orange while the prefix key is active
set -g status-left "#[bg=#{?client_prefix,#A03F00,#012456},fg=#FFFFFF,bold] #S #[default] "
set -g window-status-separator ""
set -g window-status-format "#[fg=#48607F] #I #W "
set -g window-status-current-format "#[bg=#D5E2F4,fg=#00616F,bold] #I #W#{?window_zoomed_flag, Z,} #[default]"
set -g window-status-activity-style "fg=#7A4A00"
set -g window-status-bell-style "fg=#A81D17"

# right side: prefix hint, git branch of the active pane, clock
set -g status-right "#[fg=#A03F00]#{?client_prefix,PREFIX ,}#[fg=#6A2C9B]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=#48607F]%H:%M "

# ── panes, messages, popups ────────────────────────────
set -g pane-border-style "fg=#8FA8CB"
set -g pane-active-border-style "fg=#012456"
set -g message-style "bg=#D5E2F4,fg=#7A4A00"
set -g message-command-style "bg=#D5E2F4,fg=#00616F"
set -g mode-style "bg=#BCD3F2,fg=#0B1B33"
set -g popup-style "bg=#E5EDF8,fg=#0B1B33"
set -g popup-border-style "fg=#012456"
set -g popup-border-lines rounded
set -g display-panes-active-colour "#012456"
set -g display-panes-colour "#48607F"
set -g clock-mode-colour "#00616F"
